<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resona — проверка связи</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 18px 40px;
        background: #0f0d0b;
        color: #f4eadc;
        font: 16px/1.5 "Segoe UI", -apple-system, system-ui, sans-serif;
      }
      h1 { font: 600 24px/1.25 Georgia, serif; margin: 0 0 6px; }
      p.lede { margin: 0 0 20px; color: #a89a89; }
      .row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 16px;
        margin-bottom: 10px;
        background: #171310;
        border: 1px solid #241d18;
        border-radius: 14px;
      }
      .mark { font-size: 20px; line-height: 1.2; }
      .name { font-weight: 600; }
      .note { color: #a89a89; font-size: 14px; margin-top: 2px; }
      .ok { color: #8fbf7a; }
      .bad { color: #e08a7a; }
      .wait { color: #a89a89; }
      #verdict {
        margin-top: 20px;
        padding: 16px;
        border-radius: 14px;
        background: #171310;
        border: 1px solid #241d18;
      }
      button {
        margin-top: 16px;
        padding: 12px 18px;
        font: inherit;
        color: #1b1410;
        background: #e0b57a;
        border: 0;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Проверка связи</h1>
    <p class="lede">Ничего нажимать не нужно. Дождитесь галочек и пришлите снимок экрана.</p>

    <div id="list"></div>
    <div id="verdict" class="wait">Проверяем…</div>
    <button id="copy" type="button">Скопировать результат</button>

    <script>
      // Отдельная страница без приложения: если студия не открывается, здесь
      // видно, что именно не доходит — сайт или база. Ключи не нужны: база
      // отвечает «401» даже без них, а нам важен сам факт ответа.
      const BASE = 'https://okyuoxlmjloeifvflssq.supabase.co'

      const CHECKS = [
        {
          name: 'Сайт студии',
          note: 'эта страница открылась, значит сайт доходит',
          run: async () => ({ ok: true, detail: location.host }),
        },
        {
          name: 'Вход в студию',
          note: 'сервер, который проверяет почту и пароль',
          run: () => ask(BASE + '/auth/v1/health'),
        },
        {
          name: 'База данных',
          note: 'расписание, абонементы, песни',
          run: () => ask(BASE + '/rest/v1/'),
        },
        {
          name: 'Ваш интернет',
          note: 'нужен, чтобы понять, у какого оператора сбой',
          run: async () => {
            const response = await fetch('https://ipinfo.io/json', { cache: 'no-store' })
            const body = await response.json()
            return { ok: true, detail: [body.org, body.city, body.country].filter(Boolean).join(', ') }
          },
        },
      ]

      async function ask(url) {
        const started = Date.now()
        const stop = new AbortController()
        const bell = setTimeout(() => stop.abort(), 15000)
        try {
          const response = await fetch(url, { cache: 'no-store', signal: stop.signal })
          return { ok: true, detail: `ответ за ${Date.now() - started} мс` }
        } catch (error) {
          const why = error.name === 'AbortError' ? 'не ответил за 15 секунд' : 'соединение не прошло'
          return { ok: false, detail: `${why} (${Date.now() - started} мс)` }
        } finally {
          clearTimeout(bell)
        }
      }

      const list = document.getElementById('list')
      const verdict = document.getElementById('verdict')
      const lines = []

      async function main() {
        const rows = CHECKS.map((check) => {
          const row = document.createElement('div')
          row.className = 'row'
          row.innerHTML =
            '<span class="mark wait">…</span><div><div class="name"></div><div class="note"></div></div>'
          row.querySelector('.name').textContent = check.name
          row.querySelector('.note').textContent = check.note
          list.appendChild(row)
          return row
        })

        let broken = 0
        for (let i = 0; i < CHECKS.length; i++) {
          let result
          try {
            result = await CHECKS[i].run()
          } catch (error) {
            result = { ok: false, detail: 'не получилось проверить' }
          }
          const mark = rows[i].querySelector('.mark')
          mark.textContent = result.ok ? '✓' : '✕'
          mark.className = 'mark ' + (result.ok ? 'ok' : 'bad')
          rows[i].querySelector('.note').textContent = result.detail
          if (!result.ok) broken++
          lines.push(`${result.ok ? 'OK' : 'СБОЙ'} · ${CHECKS[i].name} · ${result.detail}`)
        }

        const base = lines.find((l) => l.includes('База данных')) || ''
        const auth = lines.find((l) => l.includes('Вход')) || ''
        if (!broken) {
          verdict.className = 'ok'
          verdict.textContent = 'Связь в порядке. Приложение должно работать без VPN.'
        } else if (base.startsWith('СБОЙ') || auth.startsWith('СБОЙ')) {
          verdict.className = 'bad'
          verdict.textContent =
            'Сайт открывается, а до базы связь не доходит. Так бывает у отдельных операторов. Пришлите этот экран — перенесём базу на адрес, который виден без VPN.'
        } else {
          verdict.className = 'bad'
          verdict.textContent = 'Часть проверок не прошла. Пришлите этот экран.'
        }
        lines.push('Итог: ' + verdict.textContent)
        lines.push('Браузер: ' + navigator.userAgent)
      }

      document.getElementById('copy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(lines.join('\n'))
          document.getElementById('copy').textContent = 'Скопировано'
        } catch {
          document.getElementById('copy').textContent = 'Не вышло — пришлите снимок экрана'
        }
      })

      main()
    </script>
  </body>
</html>
